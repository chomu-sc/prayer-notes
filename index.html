function seed(){

/* ---------- overlays ---------- */
let overlay=[];

function dropToast(){const t=document.querySelector('.toast');t&&t.remove();}
function scrim(dim){const s=document.createElement('div');s.className='scrim'+(dim?' dim':'');s.addEventListener('click',closeAll);document.body.append(s);overlay.push(s);return s;}
function place(el,anchor){
  const r=anchor.getBoundingClientRect(),w=el.offsetWidth,h=el.offsetHeight,vw=innerWidth,vh=innerHeight;
  let left=Math.min(r.right-w,vw-w-12);left=Math.max(12,left);
  let top=r.bottom+6;if(top+h>vh-12) top=Math.max(12,r.top-h-6);
  el.style.left=left+'px';el.style.top=top+'px';
}
function menu(anchor,html){

function setStatus(id,next,log){
  const p=P(id),prev={status:p.status,statusAt:p.statusAt,statusLog:p.statusLog};
  if(log&&p.status&&p.status!==next) p.statusLog=(p.statusLog||[]).concat({status:p.status,at:p.statusAt,changedAt:Date.now(),to:next});
  p.status=next;p.statusAt=next?Date.now():null;
  commit();
  const undo=()=>{Object.assign(p,prev);if(!prev.statusLog)delete p.statusLog;commit();};
  const tail=log&&prev.status?' · 역사에 기록했어요':'';
  if(ANSWERED.has(next)&&!ANSWERED.has(prev.status)) toast(`${LABEL[next]} · 응답 보관함으로 옮겼어요${tail}`,undo);
  else if(!next) toast(`기도 중으로 되돌렸어요${tail}`,undo);
  else toast(`응답을 바꿨어요 (${prev.status?LABEL[prev.status]+' → ':''}${LABEL[next]})${tail}`,undo);
}
function askStatusLog(btn,id,next){

const toDate=t=>{const d=new Date(t);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const fromDate=(v,orig)=>{if(!v)return orig;const [y,m,d]=v.split('-').map(Number);const o=new Date(orig||Date.now());return new Date(y,m-1,d,o.getHours(),o.getMinutes()).getTime();};
function histSheet(id){

function editSheet(id){

/* two-tap confirm for permanent actions (dialogs are unavailable) */
function armed(btn,label,fn){
  if(btn.classList.contains('armed')){fn();return;}
  btn.classList.add('armed');const old=btn.textContent;btn.textContent=label;
  setTimeout(()=>{if(btn.isConnected){btn.classList.remove('armed');btn.textContent=old;}},3500);
}

/* ---------- swipe ---------- */
let drag=null,openRow=null,suppress=false;
function openSwipe(r){if(openRow&&openRow!==r)openRow.classList.remove('open');r.classList.add('open');openRow=r;r.querySelector('.sw-act').tabIndex=0;}
function closeRow(){if(openRow){openRow.classList.remove('open');const a=openRow.querySelector('.sw-act');a&&(a.tabIndex=-1);}openRow=null;}
document.addEventListener('pointerdown',e=>{
  if(openRow&&!e.target.closest('.sw.open')&&!e.target.closest('.menu')) closeRow();
  const b=e.target.closest('.sw-body');if(!b||!b.parentElement.querySelector('.sw-act'))return;
  drag={el:b,row:b.parentElement,x:e.clientX,y:e.clientY,base:b.parentElement.classList.contains('open')?-W:0,dx:0,on:false,id:e.pointerId};
});
document.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.id)return;
  const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
  if(!drag.on){
    if(Math.abs(dx)>8&&Math.abs(dx)>Math.abs(dy)){drag.on=true;drag.el.style.transition='none';try{drag.el.setPointerCapture(e.pointerId)}catch(_){}}
    else if(Math.abs(dy)>10){drag=null;return;} else return;
  }
  drag.dx=dx;drag.el.style.transform=`translateX(${Math.max(-W-28,Math.min(0,drag.base+dx))}px)`;
});
function endDrag(){
  if(!drag)return;const d=drag;drag=null;if(!d.on)return;
  d.el.style.transition='';d.el.style.transform='';
  (d.base+d.dx< -W/2)?openSwipe(d.row):(d.row===openRow?closeRow():d.row.classList.remove('open'));
  suppress=true;setTimeout(()=>suppress=false,50);
}
document.addEventListener('pointerup',endDrag);document.addEventListener('pointercancel',endDrag);
let wheelAcc=0,wheelT=null;
document.addEventListener('wheel',e=>{
  const b=e.target.closest('.sw-body');if(!b||!b.parentElement.querySelector('.sw-act'))return;
  if(Math.abs(e.deltaX)<=Math.abs(e.deltaY))return;
  e.preventDefault();wheelAcc+=e.deltaX;clearTimeout(wheelT);wheelT=setTimeout(()=>wheelAcc=0,180);
  if(wheelAcc>40){openSwipe(b.parentElement);wheelAcc=0;} else if(wheelAcc<-40){if(openRow===b.parentElement)closeRow();wheelAcc=0;}
},{passive:false});
document.addEventListener('contextmenu',e=>{
  const b=e.target.closest('.sw-body');if(!b||!b.parentElement.querySelector('.sw-act'))return;
  e.preventDefault();openSwipe(b.parentElement);prayerMenu(b.parentElement.querySelector('.sw-act'),b.parentElement.dataset.id);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeAll();closeRow();return;}
  if(e.key==='Enter'&&e.target.matches&&e.target.matches('li[data-act=hist-edit]')){e.preventDefault();histSheet(e.target.dataset.id);return;}
  const b=e.target.closest&&e.target.closest('.sw-body');
  if(b&&b.parentElement.querySelector('.sw-act')&&(e.key==='Enter'||e.key===' '||e.key==='ContextMenu')){
    e.preventDefault();openSwipe(b.parentElement);prayerMenu(b.parentElement.querySelector('.sw-act'),b.parentElement.dataset.id);}
});

/* ---------- clicks ---------- */
document.addEventListener('click',e=>{
  if(suppress){e.preventDefault();return;}
  const g=e.target.closest('[data-go]');if(g){closeAll();go(g.dataset.go);return;}
  const b=e.target.closest('[data-act]');
  if(!b){const body=e.target.closest('.sw.open .sw-body');if(body){closeRow();return;}
    const sb=e.target.closest('.sw-body');const li=sb&&sb.closest('.sw[data-id]');
    if(li&&isDesk()&&li.querySelector('.sw-act')){S.sel=li.dataset.id;renderDetail();}
    return;}
  const id=b.dataset.id||(b.closest('.sw')&&b.closest('.sw').dataset.id);
  switch(b.dataset.act){
    case 'more':prayerMenu(b,id);break;
    case 'answer':{const p=P(id),sv=b.dataset.s,next=p.status===sv?null:sv;
      if(ANSWERED.has(p.status)){if(next!==p.status)askStatusLog(b,id,next);break;}
      closeAll();closeRow();setStatus(id,next,p.status==='WAIT'&&!!next);break;}
    case 'unanswer':askStatusLog(b,id,null);break;
    case 'answer-do':closeAll();closeRow();setStatus(id,b.dataset.s||null,b.dataset.log==='1');break;
    case 'edit':closeRow();editSheet(id);break;
    case 'del':closeAll();closeRow();delPrayer(id,b.dataset.log==='1');break;
    case 'close':closeAll();break;
    case 'sign-out':CLOUD.sb&&CLOUD.sb.auth.signOut();break;
    case 'supa-save':{db.settings.supaUrl=$('#supa-url').value.trim();db.settings.supaKey=$('#supa-key').value.trim();saveLocal();stopCloud();cloudInit();toast('연결 정보를 저장했어요');break;}
    case 'hist-edit':histSheet(b.dataset.id);break;
    case 'ed-del':b.closest('[data-ei],[data-si]').remove();break;
    case 'hist-restore':{closeAll();const p=P(id);p.deletedAt=null;p.gone=false;p.delLogged=false;commit();toast('기도 중으로 복귀했어요');break;}
    case 'hist-remove':armed(b,'한 번 더 누르면 지워요',()=>{const p=P(id);closeAll();if(p.gone)db.prayers=db.prayers.filter(x=>x!==p);else p.delLogged=false;commit();toast('역사에서 지웠어요');});break;
    case 'drawer':drawer();break;
    case 'back':go('intercession');break;
    case 'fab':
      if(S.view==='personal')addSheet();
      else if(S.view==='person'){const i=$('#person-add-input');i&&i.focus();}
      else menu(b,`<button class="mi" data-act="find-person">사람 찾아서 기도제목 추가</button><button class="mi" data-act="new-person" style="border-top:1px solid var(--line)">새 사람 추가</button>`);
      break;
    case 'find-person':findSheet();break;
    case 'new-person':newPersonSheet(b.dataset.name);break;
    case 'open-person':closeAll();go('person',b.dataset.pid);break;
    case 'person-more':menu(b,`<button class="mi" data-act="pin" data-pid="${S.pid}">${person(S.pid).pinnedAt?'고정 해제':'맨 위에 고정'}</button><button class="mi" data-act="rename">이름 바꾸기</button><button class="mi danger" data-act="del-person">이 사람 삭제</button>`);break;
    case 'rename':renameSheet();break;
    case 'del-person':closeAll();delPerson(S.pid);break;
    case 'ptab':S.ptab=b.dataset.tab;render();break;
    case 'filter':S.filter=b.dataset.f;render();break;
    case 'mtab':S.mtab=b.dataset.tab;render();break;
    case 'arch':S.arch=b.dataset.a;S.filter='all';render();break;
    case 'to-archive':S.arch=b.dataset.a;S.filter='all';go('archive');break;
    case 'psort':{const k=b.dataset.k;if(db.settings.peopleSort===k)db.settings.peopleDir=db.settings.peopleDir==='asc'?'desc':'asc';else{db.settings.peopleSort=k;db.settings.peopleDir=k==='abc'?'asc':'desc';}commit();break;}
    case 'cat':S.cat=b.dataset.c;render();break;
    case 'hcat':S.hcat=b.dataset.c;render();break;
    case 'group':db.settings.groupByCat=!db.settings.groupByCat;commit();break;
    case 'del-ask':{let m=b.closest('.menu');if(!m){menu(b,'');m=document.querySelector('.menu');}m.innerHTML=`<div class="lbl">기도의 역사에 삭제 기록을 남길까요?</div><button class="mi" data-act="del" data-log="1" data-id="${id}">기록 남기고 삭제</button><button class="mi" data-act="del" data-log="0" data-id="${id}">기록 없이 삭제</button><button class="mi" data-act="close" style="border-top:1px solid var(--line)">취소</button>`;m.querySelector('button').focus();break;}
    case 'cat-add':{const i=$('#cat-new');const v=i.value.trim();if(v&&!db.cats.includes(v)){db.cats.push(v);commit();toast(`'${v}' 분야를 추가했어요`);}break;}
    case 'cat-rename':catRenameSheet(b.dataset.c);break;
    case 'cat-del':armed(b,'한 번 더',()=>{const c=b.dataset.c;db.cats=db.cats.filter(x=>x!==c);db.prayers.forEach(p=>{if(p.cat===c)p.cat=null;});commit();toast(`'${c}' 분야를 지웠어요`);});break;
    case 'pin':{closeAll();const pp=person(b.dataset.pid);pp.pinnedAt=pp.pinnedAt?null:Date.now();commit();toast(pp.pinnedAt?`${pp.name}을(를) 맨 위에 고정했어요`:'고정을 해제했어요');break;}
    case 'restore':{const li=b.closest('.sw');if(li.dataset.kind==='person')person(li.dataset.id).deletedAt=null;else{const p=P(li.dataset.id);p.deletedAt=null;p.delLogged=false;}commit();toast('복원했어요');break;}
    case 'purge-one':armed(b,'한 번 더 누르면 삭제',()=>{const li=b.closest('.sw');if(li.dataset.kind==='person'){db.people=db.people.filter(p=>p.id!==li.dataset.id);db.prayers=db.prayers.filter(p=>p.personId!==li.dataset.id);}else{const p=P(li.dataset.id);if(p.delLogged)p.gone=true;else db.prayers=db.prayers.filter(x=>x!==p);}commit();toast('완전히 삭제했어요');});break;
    case 'empty-trash':armed(b,'한 번 더 누르면 모두 삭제',()=>{const gone=new Set(db.people.filter(p=>p.deletedAt).map(p=>p.id));db.people=db.people.filter(p=>!p.deletedAt);db.prayers=db.prayers.filter(p=>!gone.has(p.personId)&&(!p.deletedAt||p.delLogged));db.prayers.forEach(p=>{if(p.deletedAt)p.gone=true;});commit();toast('휴지통을 비웠어요');});break;
    case 'clear-ex':armed(b,'한 번 더 누르면 예시 삭제',()=>{const ex=new Set(db.people.filter(p=>p.ex).map(p=>p.id));db.people=db.people.filter(p=>!p.ex);db.prayers=db.prayers.filter(p=>!p.ex&&!ex.has(p.personId));commit();toast('예시를 지웠어요');});break;
    case 'backup-copy':{const txt=JSON.stringify({app:'prayer-notes',v:1,exportedAt:new Date().toISOString(),prayers:db.prayers,people:db.people,cats:db.cats,settings:db.settings});
      const ta=$('#backup-text');
      navigator.clipboard&&navigator.clipboard.writeText(txt).then(()=>toast('백업 내용을 복사했어요. 메모 앱 등에 붙여넣어 보관하세요.'),()=>{ta.value=txt;ta.select();toast('아래 칸의 내용을 직접 복사해 주세요');});
      if(!navigator.clipboard){ta.value=txt;ta.select();toast('아래 칸의 내용을 직접 복사해 주세요');}
      break;}
    case 'backup-import':importText($('#backup-text').value);break;
  }
});
function importText(txt){
  try{const d=JSON.parse(txt);if(!Array.isArray(d.prayers)||!Array.isArray(d.people))throw 0;
    db={prayers:d.prayers,people:d.people,cats:Array.isArray(d.cats)?d.cats:db.cats,settings:Object.assign({},db.settings,d.settings||{})};applyPrefs();commit();toast(`불러왔어요 · 기도제목 ${d.prayers.length}개`);}
  catch(_){toast('백업 내용을 읽지 못했어요. 복사한 내용 전체를 붙여넣었는지 확인해 주세요.');}
}
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='backup-file'&&t.files[0]){const r=new FileReader();r.onload=()=>importText(r.result);r.readAsText(t.files[0]);return;}
  if(t.type==='radio'&&t.name in db.settings){
    db.settings[t.name]=t.name==='trashDays'?Number(t.value):t.value;applyPrefs();
    if(t.name==='trashDays')purge();save();
  }
});
document.addEventListener('submit',async e=>{
  if(e.target.id==='auth-form'){e.preventDefault();
    const em=$('#auth-email').value.trim(),pw=$('#auth-pw').value,up=e.submitter&&e.submitter.value==='up';
    if(!CLOUD.sb)return;
    const r=up?await CLOUD.sb.auth.signUp({email:em,password:pw,options:{emailRedirectTo:location.href.split('#')[0].startsWith('http')?location.href.split('#')[0]:undefined}}):await CLOUD.sb.auth.signInWithPassword({email:em,password:pw});
    if(r.error){toast(/Invalid login/i.test(r.error.message)?'이메일이나 비밀번호가 맞지 않아요':/registered/i.test(r.error.message)?'이미 가입된 이메일이에요. 로그인해 주세요':/confirm/i.test(r.error.message)?'메일함의 확인 링크를 먼저 눌러 주세요':'로그인하지 못했어요: '+r.error.message);return;}
    if(up&&!r.data.session){toast('확인 메일을 보냈어요. 메일의 링크를 누른 뒤 로그인해 주세요');return;}
    toast('로그인했어요');return;}
  if(e.target.id==='person-add'){e.preventDefault();const i=$('#person-add-input');const v=i.value;S.ptab='active';addPrayer(v,S.pid);const n=$('#person-add-input');n&&n.focus();toast('등록했어요');}
});

['gesturestart','gesturechange','gestureend'].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));
document.addEventListener('touchmove',e=>{if(e.touches&&e.touches.length>1)e.preventDefault();},{passive:false});
document.addEventListener('wheel',e=>{if(e.ctrlKey)e.preventDefault();},{passive:false});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&['+','=','-','_','0'].includes(e.key))e.preventDefault();});
load();applyPrefs();parseHash();render();cloudInit();
})();
</script>
</body></html>
